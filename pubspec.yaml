name: tripmate
description: TripMate - plan trips, itineraries and budgets.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  http: ^1.2.1
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  flutter_map: ^7.0.2
  crypto: ^3.0.3
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
